name: Safety regression tests
on:
  push:
    branches: ["main", "fix/uncalibrated-verdict-safety", "feat/reproducible-public-calibration-datasets", "feat/simple-evidence-first-screening"]
  pull_request:
  workflow_dispatch:
jobs:
  scoring-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: PGN -> Stockfish -> evidence-first report smoke test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq stockfish
          python examples/analyze_pgn.py examples/model_smoke_300.pgn --player alice --depth 3 --workers 2 --json-out /tmp/evidence_report.json
          python - <<'PY'
          import json
          report = json.load(open("/tmp/evidence_report.json"))
          assessment = report["history_assessment"]
          assert assessment["games"] == 1, assessment
          assert assessment["assessment"] == "Limited history"
          assert isinstance(report["move_evidence"], list)
          print("END-TO-END PASS", assessment)
          PY
