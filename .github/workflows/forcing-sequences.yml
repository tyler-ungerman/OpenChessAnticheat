name: Evaluate forcing-aware chess sequences
on:
  push:
    branches: [fix/forcing-sequence-bias]
    paths:
      - 'backend/src/detectors/sequence_policy.py'
      - 'backend/src/detectors/human_sequence.py'
      - 'scripts/evaluate_forcing_sequences.py'
      - 'tests/test_forcing_sequence.py'
      - '.github/workflows/forcing-sequences.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements-cli.txt
          python -m pip install 'scikit-learn>=1.4,<1.9' 'datasets>=3,<6'
      - name: Validate chess move filtering
        run: python -m unittest discover -s tests -p 'test_forcing_sequence.py' -v
      - name: Compare real held-out performance on both player groups
        run: python scripts/evaluate_forcing_sequences.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forcing-sequence-evaluation
          path: data/forcing_window_metrics.json
