name: Evaluate human chess-choice model
on:
  push:
    branches: [experiment/human-move-prior]
    paths:
      - 'backend/src/detectors/human_prior.py'
      - 'scripts/experiment_human_prior.py'
      - 'tests/test_human_prior.py'
      - '.github/workflows/human-prior.yml'
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: human-prior-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-cli.txt
          python -m pip install 'scikit-learn>=1.4,<1.9' 'datasets>=3,<6'
      - name: Verify shared position features
        run: python -m unittest discover -s tests -p 'test_human_prior.py' -v
      - name: Train on genuine human moves, test real assistance
        run: |
          python scripts/experiment_human_prior.py \
            --max-rows 70000 \
            --out data/human_prior_metrics.json \
            --model-out backend/models/human_prior_v1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-choice-evaluation
          path: |
            data/human_prior_metrics.json
            backend/models/human_prior_v1.json
      - name: Bundle reproducible experimental weights
        if: success()
        run: |
          if [ ! -f backend/models/human_prior_v1.json ]; then
            echo "Human-prior replication gate failed; no weights published"
            exit 0
          fi
          cp data/human_prior_metrics.json backend/models/human_prior_v1_metrics.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/models/human_prior_v1.json backend/models/human_prior_v1_metrics.json
          if git diff --cached --quiet; then
            echo "Model matches existing artifact"
            exit 0
          fi
          git commit -m "Bundle compact human-move prior and replicated benchmark evidence"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
